# To use this INI file, set GOOGLEBIGQUERYODBCINI env to this path

[Driver]
# LogLevel(Optional): Follows abseil logging(https://abseil.io/docs/cpp/guides/logging#severity)
# 0 = (OFF) No messages should be logged.
# 1 = (ERROR) Denotes serious failures or errors that impact application functionality.
# 2 = (WARNING) Indicates potential problems or situations that might require attention.
# 3 = (INFO) Informational messages about normal events and progress.
LogLevel=0

# LogPath(Required): Folder where log files would be created. The folder must exist.
# Note: This is optional if `LogLevel=0`
LogPath=

# LogFileCount(Optional): Maximum number of log files created.
# Driver will start deleting the older files after this limit is reached.
LogFileCount=50

# LogFileSize(Optional): Maximum size of a log file in KB
LogFileSize=2000

# MaxThreads(Optional): Maximum threads the driver will spawn for catalog APIs
MaxThreads=8

# WcharEncoding(Optional, Linux/macOS only): encoding of the SQLWCHAR buffers
# that the Unicode (W) ODBC functions exchange with the Driver Manager. It must
# match the SQLWCHAR of the Driver Manager that loads the driver:
#   unixODBC                                  -> WcharEncoding=UTF-16LE
#   unixODBC built with SQL_WCHART_CONVERT    -> WcharEncoding=UTF-32LE
#   iODBC                                     -> empty (default) or UTF-32LE
# Run `odbc_config --cflags` to check how a unixODBC build was configured
# (look for -DSQL_WCHART_CONVERT).
#
# Accepted values (case-insensitive, surrounding spaces ignored):
#   UTF-8, UTF8                               1 byte per code unit
#   UTF-16, UTF-16LE, UTF16LE                 2 bytes per code unit
#   UTF-32, UTF-32LE, UTF32LE, UCS-4LE        4 bytes per code unit
#   empty or "default"                        sizeof(SQLWCHAR) of the headers
#                                             the driver was built with
#                                             (4 bytes / UTF-32LE for release
#                                             builds and on macOS)
# DriverManagerEncoding, the Simba driver's name for this setting, is accepted
# with the same values for ini files migrated from Simba. If both are set,
# WcharEncoding wins. An unrecognized value is logged as an error and the
# default is used. Ignored on Windows, where SQLWCHAR is always UTF-16LE.
#
# A value that does not match the Driver Manager garbles wide-character text.
# If the configured code unit is wider than the Driver Manager's SQLWCHAR (for
# example the default with unixODBC), the fixed-size SQLSTATE buffer of
# SQLGetDiagRecW is also overrun, so always set this for unixODBC.
#
WcharEncoding=
